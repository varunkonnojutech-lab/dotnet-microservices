services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  catalog:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - rabbitmq

  ordering:
    build:
      context: .
      dockerfile: src/OrderingService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - rabbitmq

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - catalog
      - ordering
