name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build all services
        run: |
          for proj in src/Contracts/Contracts.csproj src/CatalogService/CatalogService.csproj src/OrderingService/OrderingService.csproj src/Gateway/Gateway.csproj; do
            echo "Building $proj..."
            dotnet build "$proj" -c Release --nologo
          done
