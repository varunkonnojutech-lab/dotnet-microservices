apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ecommerce/catalog-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: RabbitMq__Host
              value: rabbitmq
            - name: ASPNETCORE_URLS
              value: http://+:8080
