apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordering
  template:
    metadata:
      labels:
        app: ordering
    spec:
      containers:
        - name: ordering
          image: ecommerce/ordering-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: RabbitMq__Host
              value: rabbitmq
            - name: ASPNETCORE_URLS
              value: http://+:8080
